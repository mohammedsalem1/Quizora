services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizora}
      POSTGRES_DB: ${POSTGRES_DB:-quizora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quizora-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizora}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quizora-db-data:
